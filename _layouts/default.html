---
layout: compress
---

<!doctype html>
<html lang="en" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body>

    {% include browser-upgrade.html %}
    {% include masthead.html %}
    <header class="university-brand" aria-label="学校标识">
      <div class="university-brand__inner">
        <a href="https://www.sau.edu.cn/index.htm" target="_blank" rel="noopener noreferrer" aria-label="访问沈阳航空航天大学官网">
          <img src="{{ '/images/sau-logo.png' | relative_url }}" alt="沈阳航空航天大学 Shenyang Aerospace University">
        </a>
      </div>
    </header>

    <div id="main" role="main">
      {% include top-profile.html %}
    
      <article class="page" itemscope itemtype="http://schema.org/CreativeWork">
        {% if page.title %}<meta itemprop="headline" content="{{ page.title | markdownify | strip_html | strip_newlines | escape_once }}">{% endif %}
        <div class="page__inner-wrap">
          <section class="page__content" itemprop="text">
            {{ content }}
          </section>
        </div>
      </article>
    </div>

    {% include scripts.html %}

  </body>
</html>
